server:
  port: 3000

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    topic:
      start-saga: start-saga
      notify-ending: notify-ending
    consumer:
      group-id: order-group
      auto-offset-reset: latest

  data:
    mongodb:
      database: admin
      uri: ${MONGO_DB_URI:mongodb://admin:123456@localhost:27017}

logging:
  level.org.apache.kafka: OFF
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    patterntemplate: "[%p] %c{1}: %m%n"
  file:
    name: logs/service.log

springdoc:
  api-docs:
    enabled: true
    title: Order Service
    version: openapi_3_0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always